name: F-Droid Buildserver Reproduce

# Runs `fdroid build` for dev.encgallery inside F-Droid's own buildserver
# image, using the exact recipe from fdroiddata MR !41906 (same NDK, same
# postbuild newline fix). The resulting unsigned APK is meant to be
# byte-identical to the F-Droid build server, then signed locally.

on:
  workflow_dispatch:
    inputs:
      appver:
        description: "appid:versionCode"
        required: true
        default: "dev.encgallery:7"

permissions:
  contents: read

jobs:
  fdroid-build:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver
      options: --user root
    steps:
      - name: Clone fdroiddata (shallow)
        run: git clone --depth 1 https://gitlab.com/fdroid/fdroiddata data

      - name: Write dev.encgallery recipe (from MR !41906)
        run: |
          cat > data/metadata/dev.encgallery.yml <<'YML'
          Categories:
            - Gallery
            - Graphics
            - Multimedia
            - Security
          License: GPL-3.0-only
          AuthorName: Wolf Project
          SourceCode: https://github.com/Wolf-Project777/wolf-gallery
          IssueTracker: https://github.com/Wolf-Project777/wolf-gallery/issues
          Changelog: https://github.com/Wolf-Project777/wolf-gallery/releases

          AutoName: Wolf Gallery

          RepoType: git
          Repo: https://github.com/Wolf-Project777/wolf-gallery.git
          Binaries: https://github.com/Wolf-Project777/wolf-gallery/releases/download/v%v/app-release.apk

          Builds:
            - versionName: 1.3.3
              versionCode: 7
              commit: 67e29425b873e5e718e82b00c10333c867bb987b
              subdir: app
              gradle:
                - yes
              srclibs:
                - reproducible-apk-tools@v0.3.0
              ndk: r27c
              postbuild: $$reproducible-apk-tools$$/inplace-fix.py --zipalign fix-newlines $$OUT$$ 'META-INF/services/*'

          AllowedAPKSigningKeys: 561ae7ddb9799690569334b291d83781150396bcf299c5ca52000641a493e915

          AutoUpdateMode: Version
          UpdateCheckMode: Tags
          CurrentVersion: 1.3.3
          CurrentVersionCode: 7
          YML
          echo "--- recipe ---"; cat data/metadata/dev.encgallery.yml

      - name: fdroid build
        working-directory: data
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          fdroid build --verbose --no-tarball "${{ github.event.inputs.appver }}"

      - name: Hash built APK
        working-directory: data
        run: |
          for f in unsigned/*.apk repo/*.apk tmp/*.apk; do
            [ -f "$f" ] && sha256sum "$f"
          done

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-buildserver-apk
          path: |
            data/unsigned/*.apk
            data/tmp/*.apk
          if-no-files-found: warn
